services:
  - type: web
    name: smartfarm-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # 아래 환경변수들은 Render 대시보드 환경변수 설정에서 직접 입력해야 합니다.
      # - key: MONGODB_URI
      # - key: TUYA_ACCESS_ID
      # - key: TUYA_ACCESS_KEY
      # - key: TUYA_WEATHER_STATION_ID
